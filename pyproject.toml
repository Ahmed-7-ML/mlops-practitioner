[project]
name = "prodml"
version = "0.1.0"
description = "MLOps Practitioner - From notebook to production"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scikit-learn",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit",
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
